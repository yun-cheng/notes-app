# Generates Notes.xcodeproj with XcodeGen: `cd apple && xcodegen`.
name: Notes
options:
  bundleIdPrefix: dev.notesapp
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PS6X9X4H2H
packages:
  NotesKit:
    path: NotesKit
targets:
  Notes:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Notes]
    dependencies:
      - package: NotesKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.notesapp.notes
        PRODUCT_NAME: Notes App
        PRODUCT_MODULE_NAME: Notes
        INFOPLIST_KEY_CFBundleDisplayName: Notes
        "INFOPLIST_KEY_CFBundleDisplayName[sdk=macosx*]": Notes App
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Notes/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: dev.notesapp.notes
            CFBundleURLSchemes: [notesapp]
