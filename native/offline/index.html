<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f4ee; --text: #24282a; --muted: #6c7270; --accent: #1f5c57; }
      @media (prefers-color-scheme: dark) { :root { --bg: #191c1b; --text: #e9e6df; --muted: #a0a7a3; --accent: #84c9bc; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 380px; text-align: center; }
      h1 { font: 600 24px/1.3 "Iowan Old Style", Georgia, serif; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 18px; }
      a { display: inline-block; padding: 9px 16px; border-radius: 9px; background: var(--accent); color: var(--bg); text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Notes can't open yet</h1>
      <p>The app needs a connection the first time it starts on this device. After that, it opens offline.</p>
      <a href="https://notes-app-afc.pages.dev/">Try again</a>
    </main>
  </body>
</html>
