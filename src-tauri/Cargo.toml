[package]
name = "notes-app"
version = "0.1.0"
description = "Notes, todos and a diary"
edition = "2024"
rust-version = "1.90"

[lib]
name = "notes_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Exact versions, each at least two weeks old when chosen.
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = { version = "=2.7.2" }
